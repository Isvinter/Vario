[package]
name = "vario-app"
description = "Paragliding flight computer app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "vario_app_lib"
# staticlib: linked into the iOS app by Xcode. cdylib: Android. rlib: desktop binary.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flight-core.workspace = true
sensor-bridge.workspace = true
vario-audio.workspace = true
vario-engine.workspace = true
tauri-plugin-vario-sensors = { path = "../plugins/vario-sensors" }
serde.workspace = true
serde_json = "1"
tauri = { version = "2", features = [] }

# The simulator feeds the app on desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sensor-sim.workspace = true

[lints]
workspace = true
