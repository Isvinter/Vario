<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vario</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #000;
        --paper: #fff;
        --muted: #555;
        --line: #bbb;
        --climb: #0a7a2f;
        --sink: #b3261e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
        font: 16px/1.4 system-ui, -apple-system, sans-serif;
        color: var(--ink);
        background: var(--paper);
        -webkit-user-select: none;
        user-select: none;
      }
      .climb {
        font-size: 84px;
        font-weight: 700;
        line-height: 1;
        text-align: center;
        font-variant-numeric: tabular-nums;
        margin: 8px 0 0;
      }
      .climb.up {
        color: var(--climb);
      }
      .climb.down {
        color: var(--sink);
      }
      .unit {
        text-align: center;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        text-align: center;
      }
      .grid div {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 4px;
      }
      .grid b {
        display: block;
        font-size: 26px;
        font-variant-numeric: tabular-nums;
      }
      .grid span {
        color: var(--muted);
        font-size: 13px;
      }
      .buttons {
        display: flex;
        gap: 8px;
        margin: 16px 0;
        flex-wrap: wrap;
      }
      button {
        flex: 1;
        min-width: 30%;
        min-height: 52px;
        font: inherit;
        font-weight: 600;
        color: var(--ink);
        background: var(--paper);
        border: 2px solid var(--ink);
        border-radius: 10px;
      }
      button.primary {
        color: var(--paper);
        background: var(--ink);
      }
      button:disabled {
        opacity: 0.35;
      }
      h2 {
        font-size: 15px;
        margin: 18px 0 6px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: right;
        padding: 4px 6px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      td.bad {
        color: var(--sink);
        font-weight: 700;
      }
      #info,
      #log {
        font: 12px/1.45 ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--muted);
        -webkit-user-select: text;
        user-select: text;
      }
      #log {
        max-height: 45vh;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        white-space: pre;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div id="climb" class="climb">–</div>
    <div class="unit">m/s</div>

    <div class="grid">
      <div><b id="altitude">–</b><span>Höhe m (Druck)</span></div>
      <div><b id="speed">–</b><span>km/h</span></div>
      <div><b id="course">–</b><span>Kurs °</span></div>
    </div>

    <div class="buttons">
      <button id="toggle" class="primary">Start</button>
      <button id="tone-climb" disabled>Testton Steigen</button>
      <button id="tone-sink" disabled>Testton Sinken</button>
    </div>

    <div id="info"></div>

    <h2>Sensoren</h2>
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Anzahl</th>
          <th>Rate Hz</th>
          <th>Alter s</th>
          <th>längste Pause s</th>
        </tr>
      </thead>
      <tbody id="sensors"></tbody>
    </table>

    <h2>Protokoll (alle 10 s, Zeiten in UTC)</h2>
    <div id="log"></div>

    <script>
      const invoke = window.__TAURI__.core.invoke;
      const $ = (id) => document.getElementById(id);

      let running = false;
      let testTone = null;

      const number = (value, digits = 0) =>
        value === null || value === undefined ? "–" : value.toFixed(digits);

      // Expected longest normal pause per sensor; anything above is highlighted.
      const sensorRows = [
        ["Beschleunigung", "accel", 0.5],
        ["Luftdruck", "pressure", 3],
        ["GPS", "gps", 3],
      ];

      function render(status) {
        const climb = status ? status.climbRateMps : null;
        const climbElement = $("climb");
        climbElement.textContent =
          climb === null || climb === undefined
            ? "–"
            : (climb >= 0 ? "+" : "−") + Math.abs(climb).toFixed(1);
        climbElement.className =
          "climb" + (climb > 0.2 ? " up" : climb < -2.5 ? " down" : "");

        $("altitude").textContent = number(status?.altitudeM);
        const fix = status?.fix;
        $("speed").textContent =
          fix?.groundSpeedMps == null ? "–" : (fix.groundSpeedMps * 3.6).toFixed(0);
        $("course").textContent = number(fix?.courseDeg);

        $("sensors").innerHTML = sensorRows
          .map(([label, key, limit]) => {
            const stats = status?.[key];
            if (!stats) return `<tr><td>${label}</td><td colspan="4">–</td></tr>`;
            const stale = stats.ageS == null || stats.ageS > limit;
            const gap = stats.longestGapS > limit;
            return `<tr>
              <td>${label}</td>
              <td>${stats.total}</td>
              <td>${stats.rateHz.toFixed(1)}</td>
              <td class="${stale ? "bad" : ""}">${number(stats.ageS, 1)}</td>
              <td class="${gap ? "bad" : ""}">${stats.longestGapS.toFixed(2)}</td>
            </tr>`;
          })
          .join("");

        if (status) {
          const log = $("log");
          const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
          log.textContent = status.summaries.join("\n");
          if (atBottom) log.scrollTop = log.scrollHeight;
        }
      }

      function setRunning(value) {
        running = value;
        $("toggle").textContent = running ? "Stopp" : "Start";
        $("tone-climb").disabled = !running;
        $("tone-sink").disabled = !running;
      }

      async function toggle() {
        $("toggle").disabled = true;
        try {
          if (running) {
            await invoke("stop");
            setRunning(false);
            $("info").textContent = "gestoppt";
          } else {
            const info = await invoke("start");
            setRunning(true);
            const s = info.sensors;
            $("info").textContent = s.native
              ? `Barometer: ${s.altimeter ? "ja" : "NEIN"} · Bewegung: ${s.motion ? "ja" : "NEIN"}\n` +
                `Standort: ${s.locationAuthorization} · Audio-Session: ${s.audioSession}\n` +
                `Ton: ${info.audio}\nLogs: ${info.logDir ?? "–"}`
              : `Simulierter Flug (kein Gerät)\nTon: ${info.audio}\nLogs: ${info.logDir ?? "–"}`;
          }
        } catch (error) {
          $("info").textContent = "Fehler: " + error;
        }
        $("toggle").disabled = false;
      }

      async function toggleTone(climb) {
        testTone = testTone === climb ? null : climb;
        await invoke("test_tone", { climbRateMps: testTone });
        $("tone-climb").classList.toggle("primary", testTone === 2.5);
        $("tone-sink").classList.toggle("primary", testTone === -4);
      }

      $("toggle").addEventListener("click", toggle);
      $("tone-climb").addEventListener("click", () => toggleTone(2.5));
      $("tone-sink").addEventListener("click", () => toggleTone(-4));

      // The web view is paused while the screen is locked; that is fine, because
      // everything important runs in Rust. After unlocking this simply resumes.
      setInterval(async () => {
        try {
          render(await invoke("status"));
        } catch (error) {
          $("info").textContent = "Fehler: " + error;
        }
      }, 200);
      render(null);
    </script>
  </body>
</html>
