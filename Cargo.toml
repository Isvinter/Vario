[workspace]
resolver = "3"
members = ["crates/*", "apps/vario-app/src-tauri", "apps/vario-app/plugins/*"]
# Plain `cargo test` / `cargo clippy` only cover the crates, which build without any
# system libraries. The app needs the Tauri system packages; include it with --workspace.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
flight-core = { path = "crates/flight-core" }
sensor-sim = { path = "crates/sensor-sim" }
vario-audio = { path = "crates/vario-audio" }
sensor-bridge = { path = "crates/sensor-bridge" }
vario-engine = { path = "crates/vario-engine" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
# "deny" rather than "forbid" so that the one crate exporting C functions can opt out.
unsafe_code = "deny"
